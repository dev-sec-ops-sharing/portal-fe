name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write
  pull-requests: write

jobs:
  build-test:
    name: 🏗️ Dry-run Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  security:
    name: 🔒 Security Scan
    uses: dev-sec-ops-sharing/devsecops-infra/.github/workflows/security-scan.yml@main
    with:
      sonar-project-key: portal-fe
      sonar-organization: dev-sec-ops-sharing
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  lint:
    name: 🧪 Lint & Type Check
    uses: dev-sec-ops-sharing/devsecops-infra/.github/workflows/lint-typecheck.yml@main

  ai-review:
    name: 🤖 AI Code Review
    if: github.event_name == 'pull_request'
    uses: dev-sec-ops-sharing/devsecops-infra/.github/workflows/ai-review.yml@main
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
